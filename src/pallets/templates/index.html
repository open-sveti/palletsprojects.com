{% extends "layout.html" %}

{% block page %}
  {{ page.content_html | safe }}
  <ul class="unlist grid grid-projects">
    {% for title in ("Flask", "Quart", "Jinja", "Click", "Werkzeug", "ItsDangerous", "MarkupSafe") %}
      {% set name = title.lower() %}
      <li>
        <a href="projects/{{ name }}">
          <h2>
            <span class="title-replace">{{ title }}</span>
            {% include "project-logotype.html" %}
          </h2>
        </a>
      </li>
    {% endfor %}
    </ul>
{% endblock %}
