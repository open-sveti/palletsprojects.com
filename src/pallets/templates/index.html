{% extends "layout.html" %}

{% block page %}
  <section>
    {{ page.content_html | safe }}
  </section>
  <ul class="unlist grid">
    {% for title in ("Flask", "Quart", "Jinja", "Click", "Werkzeug", "ItsDangerous", "MarkupSafe") %}
      {% set name = title.lower() %}
      <li>
        <a href="projects/{{ name }}" class="pallets-project contrast">
          <i><img src="/static/content/projects/{{ name }}-logo.svg"></i>
          {{ title }}
        </a>
      </li>
    {% endfor %}
    </ul>
{% endblock %}

{% block extra_head %}
  <style>
    .grid:has(.pallets-project) {
      grid-template-columns: repeat(auto-fill, minmax(clamp(16ch, 25%, 100%), 1fr));
      gap: 0;
      row-gap: calc(var(--pico-spacing) * 2);
    }
    .pallets-project:not(.does-not-exist) {
      align-items: center;
      gap: calc(var(--pico-spacing) / 2);
      font-weight: bold;
      img {
        height: 3em;
        margin: 0;
      }
    }
  </style>
{% endblock %}
