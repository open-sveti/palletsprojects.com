{% extends "layout.html" %}

{% block page %}
  <h1 style="text-align: center">
    <span class="title-replace">{{ page.name }}</span>
    {% with name=page.name.lower() %}
      {% include "project-logotype.html" %}
    {% endwith %}
  </h1>
  <nav style="justify-content: center">
    <ul>
      <li><a href="{{ page.docs }}">Documentation</a></li>
      <li><a href="{{ page.pypi }}">Releases on PyPI</a></li>
      <li><a href="{{ page.github }}">Source on GitHub</a></li>
    </ul>
  </nav>
  {{ page.content_html | safe }}
{% endblock %}
